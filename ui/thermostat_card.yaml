# ============================================================================
# HOME ASSISTANT THERMOSTAT CARD CONFIGURATION
# ============================================================================
# Lovelace card YAML for the ESPHome-owned Gazebo Stove thermostat.
#
# The ESPHome climate component is the normal thermostat controller. Its priority
# system handles Force Off, schedule standby, and timed Heat On overrides.
#
# The card displays:
# - Current temperature (sensor)
# - Thermostat target temperature (from the climate entity)
# - Presence mode (home/away selector)
# - Service override (direct GPIO12 test; not for normal operation)
# - Schedule controls
# - Manual overrides (Emergency Heat, Force Off)
# ============================================================================

type: entities
title: Gazebo Stove - Controls & Status
entities:
  - entity: sensor.gazebo_stove_gazebo_temperature
    name: Current Temperature
    icon: mdi:thermometer
  - entity: climate.gazebo_stove_gazebo_stove
    name: Thermostat
    icon: mdi:thermostat
  - type: divider
  - entity: select.gazebo_stove_presence_mode
    name: Current Mode (Home/Away)
    icon: mdi:home-account
  - entity: switch.gazebo_stove_heating_schedule
    name: Heating Schedule
    icon: mdi:calendar-clock
  - type: divider
  - entity: time.gazebo_stove_home_time_24h
    name: Home Start Time
    icon: mdi:home-clock
  - entity: time.gazebo_stove_away_time_24h
    name: Away Start Time
    icon: mdi:clock-out
  - type: divider
  - entity: switch.gazebo_stove_manual_run
    name: Heat On (Timed Override)
    icon: mdi:fire-alert
  - entity: number.gazebo_stove_manual_run_duration
    name: Heat On Duration (1–60 min)
    icon: mdi:timer
  - entity: switch.gazebo_stove_manual_stop
    name: Force Off (Highest Priority)
    icon: mdi:power-off
  - type: divider
  - entity: number.gazebo_stove_heating_hysteresis
    name: Heating Overrun (0→x°C)
    icon: mdi:arrow-expand-vertical
  - type: divider
  - type: section
    label: Advanced & Diagnostics
  - entity: number.gazebo_stove_temperature_offset
    name: DS18B20 Calibration Offset
    icon: mdi:tune-vertical
  - entity: sensor.gazebo_stove_wifi_signal_strength
    name: WiFi Signal Strength
    icon: mdi:wifi
  - entity: binary_sensor.gazebo_stove_sensor_malfunction
    name: Sensor Malfunction
    icon: mdi:alert-circle
  - entity: sensor.gazebo_stove_system_status
    name: System Status
    icon: mdi:information
  - type: section
    label: Service
  - entity: switch.gazebo_stove_stove_relay
    name: Stove Relay Service Override
    icon: mdi:tools
  - entity: switch.gazebo_stove_service_relay_pulse
    name: Service Relay Pulse (15 min)
    icon: mdi:timer-outline
show_header_toggle: false
