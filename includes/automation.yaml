# ============================================================================
# AUTOMATION & CONTROL LOGIC
# ============================================================================
# Scripts for heating control, display initialization, and system management

script:
  # Read Nextion Slider0 value and update thermostat
  # This script is called when touch is released on Page 3
  - id: read_nextion_slider
    then:
      - delay: 100ms  # Small delay for Nextion to process
      - lambda: |-
          id(nextion_slider_interaction_active) = true;
          id(nextion_slider_last_touch_ms) = millis();
          id(nextion_slider_read_pending) = true;
      - component.update: nextion_slider_sensor

  # Refresh Page 3 thermostat values.
  - id: update_nextion_thermostat
    then:
      - lambda: |-
          if (!id(nextion_ready)) {
            ESP_LOGD("NEXTION_THERMOSTAT", "Display not ready; skipping thermostat refresh");
            return;
          }
          if (id(gazebo_nextion).is_failed()) {
            ESP_LOGW("NEXTION_THERMOSTAT", "Display is_failed=true; skipping thermostat refresh");
            return;
          }

          if (!isnan(id(gazebo_temp).state) && id(gazebo_temp).state > -39.0) {
            int current_temp = (int) round(id(gazebo_temp).state);
            id(gazebo_nextion).send_command_printf("three.n1.val=%d", current_temp);
            ESP_LOGI("NEXTION_THERMOSTAT", "Refreshed three.n1.val=%d", current_temp);
          } else {
            ESP_LOGW("NEXTION_THERMOSTAT", "Gazebo temperature invalid; three.n1 not refreshed");
          }

          bool slider_edit_active = id(nextion_slider_interaction_active) || id(nextion_slider_read_pending);
          if (slider_edit_active && id(nextion_slider_last_touch_ms) != 0 && (millis() - id(nextion_slider_last_touch_ms)) > 3000) {
            ESP_LOGW("NEXTION_THERMOSTAT", "Slider edit guard timed out; allowing target refresh");
            id(nextion_slider_interaction_active) = false;
            id(nextion_slider_read_pending) = false;
            slider_edit_active = false;
          }

          if (slider_edit_active) {
            ESP_LOGD("NEXTION_THERMOSTAT", "Skipping target refresh while slider edit is active");
            return;
          }

          float target = id(gazebo_thermostat).target_temperature;
          if (!isnan(target)) {
            int target_temp = (int) round(target);
            id(gazebo_nextion).send_command_printf("three.n0.val=%d", target_temp);
            id(gazebo_nextion).send_command_printf("three.Slider0.val=%d", target_temp);
            ESP_LOGI("NEXTION_THERMOSTAT", "Refreshed three.n0.val=%d and three.Slider0.val=%d", target_temp, target_temp);
          } else {
            ESP_LOGW("NEXTION_THERMOSTAT", "Target temperature invalid; three.n0 not refreshed");
          }

  # Refresh Page 0 current outdoor weather values.
  - id: update_nextion_current_weather
    then:
      - lambda: |-
          if (!id(nextion_ready)) {
            ESP_LOGD("NEXTION_WEATHER", "Display not ready; skipping current weather refresh");
            return;
          }
          if (id(gazebo_nextion).is_failed()) {
            ESP_LOGW("NEXTION_WEATHER", "Display is_failed=true; skipping current weather refresh");
            return;
          }

          if (!isnan(id(ha_nhmeteo_temp).state)) {
            id(gazebo_nextion).send_command_printf("temp.val=%d", (int) round(id(ha_nhmeteo_temp).state));
            ESP_LOGI("NEXTION_WEATHER", "Refreshed page zero temp.val=%d", (int) round(id(ha_nhmeteo_temp).state));
          } else {
            ESP_LOGW("NEXTION_WEATHER", "NHMeteo temperature is NaN; page zero temp not refreshed");
          }

          if (!isnan(id(ha_nhmeteo_humidity).state)) {
            id(gazebo_nextion).send_command_printf("precip.val=%d", (int) round(id(ha_nhmeteo_humidity).state));
            ESP_LOGI("NEXTION_WEATHER", "Refreshed page zero precip.val=%d from NHMeteo humidity", (int) round(id(ha_nhmeteo_humidity).state));
          } else {
            ESP_LOGW("NEXTION_WEATHER", "NHMeteo humidity is NaN; page zero precip not refreshed");
          }

  # Initialize Nextion display on boot
  - id: init_nextion
    then:
      - delay: 30s  # Wait for ESP32 and Nextion to settle
      - logger.log: "Initializing Nextion display..."
      - lambda: |-
          if (id(gazebo_nextion).is_failed()) {
            ESP_LOGE("NEXTION_INIT", "Nextion display failed - cannot initialize");
            return;
          }

          if (id(nextion_sleeping)) {
            ESP_LOGI("NEXTION_INIT", "Display is sleeping - waking before init");
            id(gazebo_nextion).sleep(false);
            id(nextion_sleeping) = false;
          }

          id(gazebo_nextion).send_command("bkcmd=3"); // Enable return data
          id(gazebo_nextion).send_command("thsp=0");  // Disable no-touch sleep
          id(gazebo_nextion).send_command("cls 0x0000");
          id(gazebo_nextion).send_command("page zero"); // Force intended home page by name
          ESP_LOGI("NEXTION_INIT", "Display cleared and switched to page 'zero'");

          // Variable writes are disabled until the flashed TFT component
          // map is confirmed. The current panel rejects temp.val.

          // Mark Nextion as ready for other components to send
          id(nextion_ready) = true;

          if (!isnan(id(ha_nhmeteo_temp).state)) {
            id(gazebo_nextion).send_command_printf("temp.val=%d", (int) round(id(ha_nhmeteo_temp).state));
            ESP_LOGI("NEXTION_WEATHER", "Initialized page zero temp.val=%d", (int) round(id(ha_nhmeteo_temp).state));
          }
          if (!isnan(id(ha_nhmeteo_humidity).state)) {
            id(gazebo_nextion).send_command_printf("precip.val=%d", (int) round(id(ha_nhmeteo_humidity).state));
            ESP_LOGI("NEXTION_WEATHER", "Initialized page zero precip.val=%d from NHMeteo humidity", (int) round(id(ha_nhmeteo_humidity).state));
          }

          ESP_LOGI("NEXTION_INIT", "Display initialization complete");
      - script.execute: update_nextion_current_weather
      - script.execute: update_nextion_thermostat
      - script.execute: update_nextion_hourly
      - script.execute: update_nextion_daily


  # Refresh all Nextion pages when display wakes from sleep
  # Called by on_wake trigger in display.yaml
  # Also handles deferred initialization if display was sleeping on boot
  - id: refresh_nextion_all
    then:
      - lambda: |-
          if (id(gazebo_nextion).is_failed()) {
            ESP_LOGW("NEXTION_WAKE", "Display failed, skipping refresh");
            return;
          }
          
          // Check if we need to do initial setup (deferred from boot)
          if (!id(nextion_ready)) {
            ESP_LOGI("NEXTION_WAKE", "Display was sleeping on boot - performing deferred init");
            id(gazebo_nextion).send_command("bkcmd=3"); // Enable return data
            id(gazebo_nextion).send_command("thsp=0");  // Disable no-touch sleep
            id(nextion_ready) = true;
          }
          
          ESP_LOGI("NEXTION_WAKE", "Refreshing Nextion display values");
      - script.execute: update_nextion_current_weather
      - script.execute: update_nextion_thermostat
      - script.execute: update_nextion_hourly
      - script.execute: update_nextion_daily



  # Manage heating with priority logic for Thermostat Controller
  # PRIORITY ORDER: Force Off > Sensor Fault > Service Pulse > Away Schedule > Emergency Heat > Thermostat
  # *** PRIORITY 1 (HIGHEST): Manual Stop (Force Off) - disables ALL heating ***
  # *** PRIORITY 2: Service Relay Pulse - fixed 15-minute supervised test ***
  # *** PRIORITY 3: Presence Mode (Schedule) - Away mode disables all heating ***
  # *** PRIORITY 4: Manual Run (Emergency Heat) - configurable timer, Home only ***
  # *** PRIORITY 5 (LOWEST): Thermostat Controller - automatic temperature control ***
  - id: manage_heating
    then:
      # Check priorities and set action flags
      - lambda: |-
          bool schedule_standby = (id(presence_mode).state.compare("away") == 0);
          bool manual_stop = id(manual_stop_active);
          bool service_pulse_requested = id(service_pulse_active);
          bool manual_run_requested = id(manual_run_active);
          bool sensor_fault = id(sensor_malfunction).state || isnan(id(gazebo_temp).state) || id(gazebo_temp).state <= -39.0;
          float pwm_output = id(heater_output_level);

          ESP_LOGI("PRIORITY", "Inputs: ForceOff=%s, SensorFault=%s, ServicePulse=%s, EmergencyHeat=%s, ScheduleStandby=%s, Heater_Output=%.1f%%",
                   manual_stop ? "true" : "false",
                   sensor_fault ? "true" : "false",
                   service_pulse_requested ? "true" : "false",
                   manual_run_requested ? "true" : "false",
                   schedule_standby ? "YES" : "NO",
                   pwm_output * 100.0);

          // Determine action based on priority
          // Store decision in heating_action global: 0=Thermostat, 1=ForceOff, 2=EmergencyHeat, 3=Standby, 4=ServicePulse
          
          // Priority 1: Manual Stop (Force Off) - HIGHEST PRIORITY
          if (manual_stop) {
            id(heating_status).publish_state("Forced Off");
            id(heating_action) = 1;
            ESP_LOGI("PRIORITY", "Force Off active (Priority 1 - HIGHEST)");
            return;
          }

          // Sensor fault: fail safe with heat off.
          if (sensor_fault) {
            id(heating_status).publish_state("Sensor Fault");
            id(heating_action) = 1;
            ESP_LOGW("PRIORITY", "Sensor fault active - forcing heat OFF");
            return;
          }

          // Priority 2: supervised service test; Force Off and sensor fault
          // remain absolute lockouts.
          if (service_pulse_requested) {
            id(heating_status).publish_state("Service Relay Pulse");
            id(heating_action) = 4;
            ESP_LOGW("PRIORITY", "Service relay pulse active (Priority 2)");
            return;
          }

          // Priority 3: Away is an absolute heat-off, including Manual Run.
          if (schedule_standby) {
            id(heating_status).publish_state("Schedule Standby");
            id(heating_action) = 3;
            ESP_LOGI("PRIORITY", "Schedule: Away mode - Standby (Priority 2)");
            return;
          }

          // Priority 4: Manual Run (Emergency Heat) - configurable timer.
          if (manual_run_requested) {
            id(heating_status).publish_state("Emergency Heat");

            if (id(manual_run_timeout) == 0) {
              ESP_LOGW("MANUAL_RUN", "Timeout is 0 but manual_run_active is true - resetting");
              id(manual_run_timeout) = millis();
            }

            uint32_t elapsed = millis() - id(manual_run_timeout);
            uint32_t timeout_ms = (uint32_t) roundf(id(manual_run_duration).state * 60000.0f);
            uint32_t remaining_ms = elapsed < timeout_ms ? timeout_ms - elapsed : 0;
            id(heating_action) = 2;
            ESP_LOGI("PRIORITY", "Emergency Heat: %lu min remaining (Priority 4)",
                     (unsigned long) (remaining_ms / 60000));
            return;
          }

          // Priority 5: Thermostat Controller - Let thermostat manage heating automatically
          id(heating_action) = 0;
          
          // Update status based on thermostat output
          if (pwm_output > 0.5) {
            id(heating_status).publish_state("Heating");
          } else {
            id(heating_status).publish_state("Idle");
          }
          
          ESP_LOGI("THERMOSTAT", "Current: %.1f°C, Target: %.1f°C, Output: %.0f%%",
                   id(gazebo_temp).state,
                   id(gazebo_thermostat).target_temperature,
                   pwm_output * 100.0);
      
      # Execute action based on heating_action value
      - if:
          condition:
            lambda: 'return id(heating_action) == 1;'  # Force Off
          then:
            - climate.control:
                id: gazebo_thermostat
                mode: "OFF"
            - output.set_level:
                id: heater_pwm
                level: 0.0
            - lambda: 'id(heater_output_level) = 0.0;'
      - if:
          condition:
            lambda: 'return id(heating_action) == 2;'  # Emergency Heat
          then:
            # Stop thermostat control from overwriting the forced output on its next update.
            - climate.control:
                id: gazebo_thermostat
                mode: "OFF"
            - output.set_level:
                id: heater_pwm
                level: 1.0
            - lambda: 'id(heater_output_level) = 1.0;'
      - if:
          condition:
            lambda: 'return id(heating_action) == 4;'  # Service Relay Pulse
          then:
            - climate.control:
                id: gazebo_thermostat
                mode: "OFF"
            - output.set_level:
                id: heater_pwm
                level: 1.0
            - lambda: 'id(heater_output_level) = 1.0;'
      - if:
          condition:
            lambda: 'return id(heating_action) == 3;'  # Standby
          then:
            - climate.control:
                id: gazebo_thermostat
                mode: "OFF"
      - if:
          condition:
            lambda: 'return id(heating_action) == 0 && id(gazebo_thermostat).mode == climate::CLIMATE_MODE_OFF;'
          then:
            - climate.control:
                id: gazebo_thermostat
                mode: "HEAT"
                preset: Home
            - logger.log: "Thermostat: Restoring HEAT mode (Priority 4)"
            - component.update: gazebo_temp

  # Update relay state (used by manual overrides to trigger priority re-evaluation)
  - id: update_relay_state
    then:
      - script.execute: manage_heating

# ============================================================================
# INTERVAL AUTOMATIONS - Periodic Tasks
# ============================================================================

interval:
  # Check Manual Run timeout every second
  - interval: 1s
    then:
      - if:
          condition:
            - lambda: |-
                return id(manual_run_active);
          then:
            - if:
                condition:
                  lambda: |-
                    if (id(manual_run_timeout) == 0) {
                      ESP_LOGW("MANUAL_RUN", "Timeout check: start time is 0");
                      return false;
                    }
                    uint32_t elapsed = millis() - id(manual_run_timeout);
                    uint32_t timeout_ms = (uint32_t) roundf(id(manual_run_duration).state * 60000.0f);
                    return elapsed >= timeout_ms;
                then:
                  - logger.log: "Manual Run duration expired"
                  # Use the switch action so its state and internal flags are
                  # cleared through the same path as a user request.
                  - switch.turn_off: manual_run

  # Stop the service relay pulse after its fixed 15-minute limit.
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              return id(service_pulse_active) &&
                     (millis() - id(service_pulse_started_at) >= 15UL * 60UL * 1000UL);
          then:
            - logger.log: "Service relay pulse duration expired"
            - switch.turn_off: service_relay_pulse

  # Periodic Display Refresh (every 5s)
  # Variable writes are disabled until the flashed TFT component map is confirmed.
  - interval: 5s
    then:
      - lambda: |-
          if (id(nextion_ready) && id(gazebo_nextion).is_failed() == false) {
            ESP_LOGD("NEXTION", "Periodic display variable refresh skipped");
          }

  # Periodic heating evaluation every 30 seconds
  # This ensures manage_heating runs even when temperature is stable
  # (delta filter on temperature sensor prevents on_value from firing)
  - interval: 30s
    then:
      - script.execute: manage_heating

  # Schedule-based presence mode automation
  # Checks every minute if we should be in home or away mode based on schedule
  - interval: 60s
    then:
      - if:
          condition:
            # Only run if schedule is enabled
            - switch.is_on: schedule_enabled
          then:
            - lambda: |-
                // Get current time from SNTP time source
                auto time = id(sntp_time).now();
                if (!time.is_valid()) {
                  ESP_LOGW("SCHEDULE", "Time not synced yet, skipping schedule check");
                  return;
                }

                // Get schedule times from datetime entities
                auto home_time = id(schedule_1_home).state_as_esptime();
                auto away_time = id(schedule_2_away).state_as_esptime();

                // Current time in minutes since midnight
                int current_minutes = time.hour * 60 + time.minute;
                int home_minutes = home_time.hour * 60 + home_time.minute;
                int away_minutes = away_time.hour * 60 + away_time.minute;

                // CHANGED: Log at INFO level so user can see what's happening
                ESP_LOGI("SCHEDULE", "Check: Current=%02d:%02d (%d), Home=%02d:%02d (%d), Away=%02d:%02d (%d)",
                         time.hour, time.minute, current_minutes,
                         home_time.hour, home_time.minute, home_minutes,
                         away_time.hour, away_time.minute, away_minutes);

                // Handle edge case: equality
                if (home_minutes == away_minutes) {
                   ESP_LOGW("SCHEDULE", "Home and Away times are identical - staying in current mode");
                   return;
                }

                // Determine if we should be in home or away mode
                bool should_be_home = false;
                if (home_minutes < away_minutes) {
                  // Normal case: home 06:00 -> away 22:00 (within same day)
                  should_be_home = (current_minutes >= home_minutes && current_minutes < away_minutes);
                } else {
                  // Wraparound case: home 22:00 -> away 08:00 (crosses midnight)
                  should_be_home = (current_minutes >= home_minutes || current_minutes < away_minutes);
                }

                // Update presence mode if needed (or if Climate Mode is out of sync)
                std::string desired_mode = should_be_home ? "home" : "away";
                std::string current_mode = id(presence_mode).state;
                
                bool climate_mismatch = false;
                if (desired_mode == "away") {
                   // If Away, Climate should be OFF
                   if (id(gazebo_thermostat).mode != climate::CLIMATE_MODE_OFF) {
                     climate_mismatch = true;
                   }
                } else {
                   // If Home, Climate should NOT be OFF (should be HEAT)
                   if (id(gazebo_thermostat).mode == climate::CLIMATE_MODE_OFF) {
                     climate_mismatch = true;
                   }
                }

                if (current_mode != desired_mode || climate_mismatch) {
                  ESP_LOGI("SCHEDULE", "Updating presence mode: %s -> %s (Climate Mismatch: %s)", 
                           current_mode.c_str(), desired_mode.c_str(), climate_mismatch ? "YES" : "NO");
                  auto call = id(presence_mode).make_call();
                  call.set_option(desired_mode);
                  call.perform();
                } else {
                  // CHANGED: Log at INFO level to confirm it's working but no change needed
                  ESP_LOGI("SCHEDULE", "Presence mode correct: %s (No change)", current_mode.c_str());
                }
          else:
            - logger.log:
                level: WARN
                tag: "SCHEDULE"
                format: "Schedule check skipped: Schedule is DISABLED"
