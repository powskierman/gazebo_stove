# ============================================================================
# SENSORS & MEASUREMENTS
# ============================================================================
# DS18B20 local thermostat temperature, Home Assistant NHMeteo imports,
# WiFi signal strength, and sensor diagnostics.

sensor:
  # Nextion thermostat page slider. Match the original working C++ code, which
  # reads the fully qualified page variable: three.Slider0.val.
  - platform: nextion
    id: nextion_slider_sensor
    name: "Nextion Slider"
    nextion_id: gazebo_nextion
    variable_name: three.Slider0.val
    internal: true
    update_interval: never
    on_value:
      then:
        - lambda: |-
            int slider_val = (int) round(x);
            if (slider_val < 15 || slider_val > 25) {
              ESP_LOGW("NEXTION_SLIDER", "Ignoring out-of-range three.Slider0.val value: %d", slider_val);
              return;
            }

            id(nextion_slider_value) = slider_val;
            float desired_temp = (float) slider_val;
            ESP_LOGI("NEXTION_SLIDER", "three.Slider0.val=%d -> target %.1f°C", slider_val, desired_temp);

            auto call = id(gazebo_thermostat).make_call();
            call.set_target_temperature(desired_temp);
            call.perform();

  # ============================================================================
  # DS18B20 Temperature Sensor (OneWire)
  # ============================================================================
  - platform: dallas_temp
    one_wire_id: ow_bus
    id: gazebo_temp
    name: "Gazebo Temperature"
    address: 0x623c01f096751f28
    resolution: 12
    update_interval: 10s
    disabled_by_default: false
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
      - lambda: |-
          return x + id(temp_offset).state;
      - clamp:
          min_value: -40
          max_value: 85
    on_value:
      then:
        - lambda: |-
            if (isnan(x) || x <= -39.0) {
              id(bad_read_count) += 1;
              ESP_LOGI("TEMP_SENSOR", "Bad temperature read #%d: %.1f", id(bad_read_count), x);
              if (id(bad_read_count) > 10) {
                id(sensor_malfunction).publish_state(true);
                ESP_LOGI("TEMP_SENSOR", "ALARM: Sensor malfunction detected!");
              }
            } else {
              if (id(bad_read_count) > 0) {
                ESP_LOGI("TEMP_SENSOR", "Sensor recovered - resetting bad read counter");
              }
              id(bad_read_count) = 0;
              if (id(sensor_malfunction).state) {
                id(sensor_malfunction).publish_state(false);
              }
            }
        - if:
            condition:
              lambda: |-
                return !isnan(x) && x > -39.0;
            then:
              - lambda: !lambda |-
                  auto* climate = id(gazebo_thermostat);
                  if (climate != nullptr) {
                    climate->publish_state();
                    ESP_LOGD("CLIMATE_SYNC", "Climate state republished with temperature: %.1f°C", x);
                  }
              - script.execute: manage_heating
        - lambda: |-
            if (isnan(x) || x <= -39.0) {
              ESP_LOGW("NEXTION", "Skipping invalid gazebo temp %.1f", x);
            } else if (!id(nextion_ready)) {
              ESP_LOGD("NEXTION", "Display variable writes disabled - display not ready yet");
            } else if (id(gazebo_nextion).is_failed()) {
              ESP_LOGW("NEXTION", "Display is_failed=true, skipping update");
            } else {
              ESP_LOGD("NEXTION", "Display variable writes disabled; gazebo temp %.1f not sent", x);
            }

  # ============================================================================
  # NHMeteo Home Assistant Imports
  # ============================================================================
  - platform: homeassistant
    id: ha_nhmeteo_temp
    entity_id: sensor.nhmeteo_temperature
    internal: true
    on_value:
      then:
        - lambda: |-
            // Suppressed until the flashed Nextion TFT is confirmed to expose this field.

  - platform: homeassistant
    id: ha_nhmeteo_humidity
    entity_id: sensor.nhmeteo_humidity
    internal: true
    on_value:
      then:
        - lambda: |-
            // Suppressed until the flashed Nextion TFT is confirmed to expose this field.

  # ============================================================================
  # WiFi Signal Strength
  # ============================================================================
  - platform: wifi_signal
    name: "WiFi Signal Strength"
    id: wifi_signal_strength
    update_interval: 60s
    unit_of_measurement: "dBm"
    entity_category: "diagnostic"
