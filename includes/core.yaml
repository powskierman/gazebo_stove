# ============================================================================
# CORE ESPHOME CONFIGURATION
# ============================================================================
# Board configuration, WiFi, API, OTA, NTP, Logging

# ============================================================================
# SENSOR CONFIGURATION
# ============================================================================
# Production hardware uses a DS18B20 for local thermostat control.
# Outdoor/current condition humidity is imported from Home Assistant NHMeteo.
substitutions:
  sensor_pin: "GPIO4"

esphome:
  name: gazebo-stove
  friendly_name: Gazebo Stove Heating Control
  on_boot:
    priority: 600
    then:
      # Restore the persisted asymmetric hysteresis setting before normal control.
      - lambda: |-
          id(gazebo_thermostat).set_heat_deadband(0.0f);
          id(gazebo_thermostat).set_heat_overrun(id(heating_hysteresis).state);
          id(manual_stop).publish_state(id(manual_stop_active));
      - if:
          condition:
            lambda: 'return id(manual_stop_active);'
          then:
            - logger.log: "Force Off restored after restart"
            - script.execute: manage_heating
      - logger.log: "GazeboWx starting up..."
      - wait_until:
          condition:
            wifi.connected:
          timeout: 30s
      - logger.log: "WiFi connected, initializing components"
      - script.execute: init_nextion

# ============================================================================
# BOARD SELECTION & CONFIGURATION
# ============================================================================

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended

# ============================================================================
# LOGGING & DEBUGGING
# ============================================================================

logger:
  level: DEBUG
  logs:
    # Reduce log verbosity to prevent API connection overload
    # Set to DEBUG only when troubleshooting specific issues
    uart.debug: INFO
    # The flashed HMI emits custom printh packets beginning with 0x23, which
    # ESPHome's Nextion parser otherwise reports as protocol errors.
    nextion: NONE
    component: WARN
    sensor: WARN
    # Keep important components at INFO level
    schedule: INFO
    heating: INFO
    priority: INFO

# ============================================================================
# WIFI CONFIGURATION
# ============================================================================

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true
  output_power: 17dB
  manual_ip:
    static_ip: 192.168.0.242
    gateway: 192.168.0.1
    subnet: 255.255.255.0
    dns1: 192.168.0.1
    dns2: 1.1.1.1
  ap:
    ssid: "Gazebo-Thermostat-Fallback"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80

mdns:
  disabled: false

# ============================================================================
# HOME ASSISTANT INTEGRATION
# ============================================================================

api:
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

# ============================================================================
# NETWORK TIME PROTOCOL (NTP)
# ============================================================================

time:
  - platform: sntp
    id: sntp_time
    servers:
      - us.pool.ntp.org
    timezone: America/Toronto
    on_time_sync:
      then:
        - logger.log: "Time synced from NTP"
