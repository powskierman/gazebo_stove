# ============================================================================
# BUTTONS - Manual Controls & Actions
# ============================================================================
# Device control buttons for restart and shutdown

button:
  # Manual restart button
  - platform: restart
    name: "Device Restart"
    id: restart_button
    entity_category: "diagnostic"

  # Safe shutdown button (for maintenance)
  - platform: template
    name: "Safe Shutdown"
    id: shutdown_button
    entity_category: "diagnostic"
    on_press:
      then:
        - output.set_level:
            id: heater_pwm
            level: 0.0
        - logger.log: "Safe shutdown: Heater deactivated"
        - delay: 1s
        - button.press: restart_button
