# ============================================================================
# HARDWARE CONFIGURATION
# ============================================================================
# GPIO pins, output drivers, relays, LEDs, one-wire bus

# ============================================================================
# ONE-WIRE BUS CONFIGURATION - DS18B20 Temperature Sensor
# ============================================================================
one_wire:
  - platform: gpio
    id: ow_bus
    pin: ${sensor_pin}

# ============================================================================
# GPIO OUTPUT - Status LED (GPIO2)
# ============================================================================

output:
  - platform: gpio
    id: status_led
    pin: GPIO2
    inverted: true

light:
  - platform: binary
    name: "Status LED"
    output: status_led
    id: status_light

# ============================================================================
# RELAY STATUS (GPIO12 controlled by thermostat via slow_pwm in climate.yaml)
# ============================================================================
# Normal operation is controlled by the ESPHome thermostat and priority logic.
# This switch is an intentional, supervised direct-output control for service only.

switch:
  # Service override - bypasses thermostat/priority logic to test GPIO12 directly.
  # Keep it out of normal controls; use Manual Run or Force Off day-to-day.
  - platform: template
    name: "Stove Relay Service Override"
    id: relay
    icon: "mdi:tools"
    entity_category: diagnostic
    lambda: |-
      // Read state from the heater_output_level global
      return id(heater_output_level) > 0.5;
    turn_on_action:
      then:
        - logger.log: "Relay forced ON via UI"
        - lambda: 'id(heater_output_level) = 1.0;'
        - output.set_level:
            id: heater_pwm
            level: 1.0
        - light.turn_on: status_light
    turn_off_action:
      then:
        - logger.log: "Relay forced OFF via UI"
        - lambda: 'id(heater_output_level) = 0.0;'
        - output.set_level:
            id: heater_pwm
            level: 0.0
        - light.turn_off: status_light

  # Fixed-duration direct relay test for supervised service work. This is kept
  # separate from the normal Heat On timed override and is stopped by Force Off.
  - platform: template
    name: "Service Relay Pulse (15 min)"
    id: service_relay_pulse
    icon: "mdi:timer-outline"
    entity_category: diagnostic
    restore_mode: ALWAYS_OFF
    assumed_state: false
    lambda: |-
      return id(service_pulse_active);
    turn_on_action:
      then:
        - if:
            condition:
              lambda: 'return id(manual_stop_active);'
            then:
              - logger.log: "Service relay pulse rejected: Force Off is active."
              - switch.turn_off: service_relay_pulse
            else:
              - lambda: |-
                  id(service_pulse_active) = true;
                  id(service_pulse_started_at) = millis();
                  id(service_relay_pulse).publish_state(true);
                  ESP_LOGW("SERVICE_PULSE", "15-minute service relay pulse started");
              - script.execute: manage_heating
    turn_off_action:
      then:
        - lambda: |-
            id(service_pulse_active) = false;
            id(service_pulse_started_at) = 0;
            id(service_relay_pulse).publish_state(false);
            ESP_LOGI("SERVICE_PULSE", "Service relay pulse stopped");
        - script.execute: manage_heating

  # Manual Run Override (duration configured in Home Assistant)
  - platform: template
    name: "Manual Run"
    id: manual_run
    icon: "mdi:fire-alert"
    restore_mode: ALWAYS_OFF
    assumed_state: false
    lambda: |-
      // Switch state is controlled by manual_run_active global variable
      return id(manual_run_active);
    turn_on_action:
      then:
        - if:
            condition:
              lambda: 'return id(manual_stop_active);'
            then:
              - logger.log: "Cannot enable Manual Run: Manual Stop is active."
              # Turn the switch back off immediately in the UI to reflect that the action was rejected
              - switch.turn_off: manual_run
            else:
              - logger.log: "Manual Run enabled"
              - lambda: |-
                  id(manual_run_timeout) = millis();
                  id(manual_run_active) = true;
                  ESP_LOGI("MANUAL_RUN", "Activated for %.0f minutes at %lu ms",
                           id(manual_run_duration).state, (unsigned long) id(manual_run_timeout));
                  // Update switch state to reflect the change
                  id(manual_run).publish_state(true);
              - script.execute: manage_heating
    turn_off_action:
      then:
        - logger.log: "Manual Run disabled"
        - lambda: |-
            id(manual_run_timeout) = 0;
            id(manual_run_active) = false;
            ESP_LOGI("MANUAL_RUN", "Deactivated by user");
            // Update switch state to reflect the change
            id(manual_run).publish_state(false);
        - script.execute: manage_heating

  # Manual Stop Override (Force heating off indefinitely)
  - platform: template
    name: "Manual Stop"
    id: manual_stop
    icon: "mdi:power-off"
    # State is supplied by the persisted manual_stop_active global.
    restore_mode: DISABLED
    assumed_state: false
    lambda: |-
      return id(manual_stop_active);
    turn_on_action:
      then:
        - logger.log: "Manual Stop enabled - Heating disabled"
        - lambda: |-
            id(manual_stop_active) = true;
            // Deactivate Manual Run (mutually exclusive)
            if (id(manual_run_active)) {
              ESP_LOGI("MANUAL_STOP", "Deactivating Manual Run (mutually exclusive)");
              id(manual_run_active) = false;
              id(manual_run_timeout) = 0;
              id(manual_run).publish_state(false);
            }
            ESP_LOGI("MANUAL_STOP", "Enabled - Relay OFF indefinitely");
            id(manual_stop).publish_state(true);
        # Force heater off via PWM output
        - output.set_level:
            id: heater_pwm
            level: 0.0
        - light.turn_off: status_light
        - script.execute: update_relay_state
    turn_off_action:
      then:
        - logger.log: "Manual Stop disabled - Restoring normal control"
        - lambda: |-
            id(manual_stop_active) = false;
            ESP_LOGI("MANUAL_STOP", "Disabled - Heating control restored");
            id(manual_stop).publish_state(false);
        - script.execute: manage_heating

  # Schedule Enable Switch
  - platform: template
    name: "Schedule Enabled"
    id: schedule_enabled
    icon: "mdi:calendar-clock"
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: yes
    turn_on_action:
      then:
        - logger.log: "Schedule enabled - Automatic home/away switching"
        - script.execute: evaluate_schedule
    turn_off_action:
      then:
        - logger.log: "Schedule disabled - Manual presence mode only"
        - script.execute: manage_heating
