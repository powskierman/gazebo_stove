# ============================================================================
# CLIMATE (THERMOSTAT) COMPONENT
# ============================================================================
# ESPHome thermostat climate component for propane stove heating control
# All control logic runs on ESP32 - works even if Home Assistant is unavailable

# ============================================================================
# HEATER OUTPUT - Binary relay output used by the thermostat climate platform
# ============================================================================
output:
  - platform: slow_pwm
    id: heater_pwm
    pin: GPIO12
    period: 120s
    turn_on_action:
      then:
        - lambda: 'id(heater_output_level) = 1.0;'
        - light.turn_on: status_light
    turn_off_action:
      then:
        - lambda: 'id(heater_output_level) = 0.0;'
        - light.turn_off: status_light

# ============================================================================
# THERMOSTAT CLIMATE CONTROLLER
# ============================================================================
climate:
  - platform: thermostat
    id: gazebo_thermostat
    name: "Gazebo Stove"
    sensor: gazebo_temp
    min_heating_off_time: 30s
    min_heating_run_time: 30s
    min_idle_time: 10s
    # Both sides of the initial ±3°C thermostat band are made user-adjustable
    # by number.heating_hysteresis at startup and on every change.
    heat_deadband: 3.0°C
    heat_overrun: 3.0°C
    heat_action:
      - output.set_level:
          id: heater_pwm
          level: 1.0
      - lambda: 'id(heater_output_level) = 1.0;'
      - light.turn_on: status_light
    idle_action:
      - output.set_level:
          id: heater_pwm
          level: 0.0
      - lambda: 'id(heater_output_level) = 0.0;'
      - light.turn_off: status_light
    off_mode:
      - output.set_level:
          id: heater_pwm
          level: 0.0
      - lambda: 'id(heater_output_level) = 0.0;'
      - light.turn_off: status_light
    default_preset: Home
    preset:
      - name: Home
        default_target_temperature_low: 20°C
        mode: HEAT
    visual:
      min_temperature: 5
      max_temperature: 35
      temperature_step: 0.5

    # Update Nextion display when target temperature changes
    on_control:
      - script.execute: update_nextion_thermostat

# ============================================================================
# IMPLEMENTATION NOTES
# ============================================================================
# The thermostat climate controller provides:
# 1. Heat-only on/off temperature control
# 2. 2°C total hysteresis width: heat below target - 1°C, idle above target + 1°C
# 3. Minimum run/off/idle timers to prevent rapid relay cycling
#
# Priority overrides (Force Off, Emergency Heat, Schedule) are handled
# by the manage_heating script in automation.yaml which can override
# the thermostat controller when needed.
#
# Note: The heater_output_level global is updated by slow_pwm on/off actions
# to track the current state for the priority override system.
