# ============================================================================
# ENTITIES - User Configuration & Status
# ============================================================================
# Number sliders, select dropdowns, binary sensors, and text sensors

# ============================================================================
# BINARY SENSORS - Status & Alarms
# ============================================================================

binary_sensor:
  # Sensor Malfunction Alarm
  - platform: template
    name: "Sensor Malfunction"
    id: sensor_malfunction
    icon: "mdi:alert-circle"
    device_class: problem
    lambda: |-
      return id(bad_read_count) > 10;

# ============================================================================
# NUMBER ENTITIES - User Configuration
# ============================================================================

number:

  # Duration of the Manual Run override
  - platform: template
    name: "Manual Run Duration"
    id: manual_run_duration
    min_value: 1
    max_value: 120
    step: 1
    mode: box
    unit_of_measurement: "min"
    icon: "mdi:timer"
    entity_category: "config"
    restore_value: yes
    optimistic: true
    initial_value: 15
    set_action:
      then:
        - logger.log:
            format: "Manual Run duration set to %.0f minutes"
            args: ["x"]

  # Temperature Offset (Calibration)
  - platform: template
    name: "Temperature Offset"
    id: temp_offset
    min_value: -10
    max_value: 10
    step: 0.1
    unit_of_measurement: "°C"
    icon: "mdi:plus-minus"
    entity_category: "diagnostic"
    restore_value: yes
    optimistic: true
    initial_value: -6.0
    set_action:
      then:
        - logger.log:
            format: "Temperature offset set to %.1f°C"
            args: ["x"]

  # PID proportional gain
  - platform: template
    name: "PID Kp"
    id: pid_kp
    min_value: 0
    max_value: 20
    step: 0.1
    mode: box
    icon: "mdi:tune"
    entity_category: "config"
    restore_value: yes
    optimistic: true
    initial_value: 5.0
    set_action:
      then:
        - lambda: |-
            id(gazebo_thermostat).set_kp(x);
            ESP_LOGI("PID_TUNING", "PID Kp set to %.3f", x);

  # PID integral gain
  - platform: template
    name: "PID Ki"
    id: pid_ki
    min_value: 0
    max_value: 0.1
    step: 0.001
    mode: box
    icon: "mdi:tune"
    entity_category: "config"
    restore_value: yes
    optimistic: true
    initial_value: 0.003
    set_action:
      then:
        - lambda: |-
            id(gazebo_thermostat).set_ki(x);
            ESP_LOGI("PID_TUNING", "PID Ki set to %.4f", x);

  # PID derivative gain
  - platform: template
    name: "PID Kd"
    id: pid_kd
    min_value: 0
    max_value: 500
    step: 1
    mode: box
    icon: "mdi:tune"
    entity_category: "config"
    restore_value: yes
    optimistic: true
    initial_value: 100
    set_action:
      then:
        - lambda: |-
            id(gazebo_thermostat).set_kd(x);
            ESP_LOGI("PID_TUNING", "PID Kd set to %.1f", x);

  # PID deadband upper threshold relative to target temperature
  - platform: template
    name: "PID Deadband High"
    id: pid_deadband_high
    min_value: 0
    max_value: 5
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
    icon: "mdi:thermometer-chevron-up"
    entity_category: "config"
    restore_value: yes
    optimistic: true
    initial_value: 1.0
    set_action:
      then:
        - lambda: |-
            id(gazebo_thermostat).set_threshold_high(x);
            ESP_LOGI("PID_TUNING", "PID deadband high set to %.1f°C", x);

  # PID deadband lower threshold relative to target temperature
  - platform: template
    name: "PID Deadband Low"
    id: pid_deadband_low
    min_value: -5
    max_value: 0
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
    icon: "mdi:thermometer-chevron-down"
    entity_category: "config"
    restore_value: yes
    optimistic: true
    initial_value: -1.0
    set_action:
      then:
        - lambda: |-
            id(gazebo_thermostat).set_threshold_low(x);
            ESP_LOGI("PID_TUNING", "PID deadband low set to %.1f°C", x);

  # Slow PWM relay cycle period
  - platform: template
    name: "Heater PWM Period"
    id: heater_pwm_period
    min_value: 60
    max_value: 900
    step: 10
    mode: box
    unit_of_measurement: "s"
    icon: "mdi:timer-cog"
    entity_category: "config"
    restore_value: yes
    optimistic: true
    initial_value: 120
    set_action:
      then:
        - lambda: |-
            unsigned int period_ms = (unsigned int) roundf(x * 1000.0f);
            id(heater_pwm).set_period(period_ms);
            id(heater_pwm).restart_cycle();
            ESP_LOGI("PID_TUNING", "Heater PWM period set to %.0fs", x);

# ============================================================================
# SELECT ENTITIES - Mode Selection
# ============================================================================

select:
  # Presence Mode
  - platform: template
    name: "Presence Mode"
    id: presence_mode
    options:
      - "home"
      - "away"
    initial_option: "home"
    restore_value: true
    optimistic: true
    set_action:
      then:
        - logger.log:
            format: "Presence mode set to: %s"
            args: ["x.c_str()"]
        # Sync Thermostat Preset and Mode with Presence Mode
        - if:
            condition:
              lambda: 'return x == "away";'
            then:
              # User wants explicit "OFF" in UI
              - climate.control:
                  id: gazebo_thermostat
                  mode: "OFF"
            else:
              # Restore Heating in Home mode
              - climate.control:
                  id: gazebo_thermostat
                  mode: "HEAT"
                  preset: Home
        # Re-evaluate heating when presence changes
        - script.execute: manage_heating

# ============================================================================
# SWITCH ENTITIES - Manual Overrides
# ============================================================================
# Note: Manual Run and Manual Stop switches are now defined in hardware.yaml
# This prevents YAML section conflicts when merging multiple includes

# ============================================================================
# TEXT SENSORS - Status Messages & Information
# ============================================================================

text_sensor:
  # WiFi Information
  - platform: wifi_info
    ip_address:
      name: "Device IP Address"
      id: device_ip
      entity_category: "diagnostic"
    ssid:
      name: "WiFi SSID"
      id: wifi_ssid
      entity_category: "diagnostic"
    mac_address:
      name: "MAC Address"
      entity_category: "diagnostic"
    bssid:
      name: "WiFi BSSID"
      entity_category: "diagnostic"

  # System Status Message
  - platform: template
    name: "System Status"
    id: system_status
    update_interval: 10s
    lambda: |-
      if (id(sensor_malfunction).state) {
        return std::string("ALARM: Sensor Malfunction");
      } else if (!id(gazebo_nextion).is_failed()) {
        return std::string("OK - Nextion Connected");
      } else {
        return std::string("OK - Display Offline");
      }

  # Heating Status
  - platform: template
    name: "Heating Status"
    id: heating_status
    icon: "mdi:power"

# ============================================================================
# DATETIME ENTITIES - Schedule Times (24-hour format)
# ============================================================================
# Note: Entity IDs use numbering (1, 2) to ensure Home appears before Away
# in Home Assistant UI (alphabetical sorting by entity_id)

datetime:
  # Home Mode Start Time (24-hour format time picker)
  - platform: template
    type: time
    name: "Home Time (24h)"
    id: schedule_1_home
    icon: "mdi:home-clock"
    optimistic: yes
    initial_value: "06:00:00"
    restore_value: true

  # Away Mode Start Time (24-hour format time picker)
  - platform: template
    type: time
    name: "Away Time (24h)"
    id: schedule_2_away
    icon: "mdi:clock-outline"
    optimistic: yes
    initial_value: "22:00:00"
    restore_value: true

# ============================================================================
# GLOBAL VARIABLES - Internal State Tracking
# ============================================================================

globals:
  # Bad temperature read counter
  - id: bad_read_count
    type: int
    restore_value: no
    initial_value: '0'

  # Manual run timeout timestamp
  - id: manual_run_timeout
    type: long
    restore_value: no
    initial_value: '0'

  # Manual run state tracker
  - id: manual_run_active
    type: bool
    restore_value: no
    initial_value: 'false'

  # Manual stop state tracker
  - id: manual_stop_active
    type: bool
    restore_value: no
    initial_value: 'false'

  # Nextion Slider0 value tracker (HMI range 15-25°C)
  - id: nextion_slider_value
    type: float
    restore_value: no
    initial_value: '20'

  # Slider touch release flag
  - id: slider_touched
    type: bool
    restore_value: no
    initial_value: 'false'

  # Prevent stale thermostat refreshes from overwriting the slider while the
  # user is dragging it or while a readback is in progress.
  - id: nextion_slider_interaction_active
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: nextion_slider_last_touch_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Waiting for Nextion numeric return from get three.Slider0.val
  - id: nextion_slider_read_pending
    type: bool
    restore_value: no
    initial_value: 'false'

  # Heater output level tracker (0.0 to 1.0)
  # Used to track slow_pwm output since it doesn't have get_state()
  - id: heater_output_level
    type: float
    restore_value: no
    initial_value: '0.0'

  # Heating action flag for priority system
  # 0=PID, 1=ForceOff, 2=EmergencyHeat, 3=Standby
  - id: heating_action
    type: int
    restore_value: no
    initial_value: '0'

  # Nextion display ready flag - prevents early sends before init
  - id: nextion_ready
    type: bool
    restore_value: no
    initial_value: 'false'

  # Nextion display sleep state - true when display is asleep
  - id: nextion_sleeping
    type: bool
    restore_value: no
    initial_value: 'true'  # Assume sleeping on boot until on_wake fires
