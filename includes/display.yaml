# ============================================================================
# NEXTION DISPLAY INTEGRATION
# ============================================================================
# UART configuration and Nextion display component

# ============================================================================
# UART CONFIGURATION - Nextion Display (GPIO16/17)
# ============================================================================

uart:
  - id: uart_nextion
    tx_pin: GPIO17
    rx_pin: GPIO16
    # Match the original working Arduino/Blynk implementation:
    # Serial2.begin(9600, SERIAL_8N1, RXD2, TXD2); myNex.begin(9600).
    baud_rate: 9600
    # UART Debug - Parses Nextion HMI custom status packets
    # --------------------------------------------------------
    # Protocol: 23 02 54 00/01, sent by gazeboV4.HMI using printh.
    # The leading 0x23 collides with ESPHome's Nextion protocol parser, so
    # nextion component logging is suppressed in core.yaml while this HMI is used.
    debug:
      direction: RX  # Only log received data
      dummy_receiver: false
      after:
        bytes: 4
        timeout: 50ms
      sequence:
        - lambda: |-
            // Log the raw data
            ESP_LOGD("NEXTION_UART", "RX: %s (%d bytes)", format_hex_pretty(bytes).c_str(), bytes.size());
            
            for (size_t i = 0; i + 3 < bytes.size(); i++) {
              if (bytes[i] == 0x23 && bytes[i + 1] == 0x02 && bytes[i + 2] == 0x54) {
                uint8_t page_flag = bytes[i + 3];
                ESP_LOGI("NEXTION_HMI", "HMI status packet: 0x%02X", page_flag);
                if (page_flag == 0x00) {
                  id(slider_touched) = true;
                }
                break;
              }
            }

            if (id(nextion_slider_read_pending) && bytes.size() >= 4 && bytes[0] == 0x71) {
              // Numeric response to "get three.Slider0.val". For this 15-25°C
              // slider, the low byte is sufficient even when the 4th numeric byte
              // arrives in the next UART debug chunk with the terminator bytes.
              int slider_val = bytes[1] | (bytes[2] << 8) | (bytes[3] << 16);
              id(nextion_slider_read_pending) = false;

              if (slider_val < 15 || slider_val > 25) {
                ESP_LOGW("NEXTION_SLIDER", "Ignoring out-of-range numeric Slider0 value: %d", slider_val);
              } else {
                id(nextion_slider_value) = slider_val;
                float desired_temp = (float) slider_val;
                ESP_LOGI("NEXTION_SLIDER", "Numeric three.Slider0.val=%d -> target %.1f°C", slider_val, desired_temp);

                auto call = id(gazebo_thermostat).make_call();
                call.set_target_temperature(desired_temp);
                call.perform();
              }
            }

            // gazeboV4.1.HMI sends: printh 91; prints Slider0.val,0
            // Accept that direct-value form as well as the EasyNex-style trigger.
            for (size_t i = 0; i < bytes.size(); i++) {
              if (bytes[i] != 0x91) {
                continue;
              }

              int slider_val = 0;
              bool found_digit = false;
              for (size_t j = i + 1; j < bytes.size(); j++) {
                if (bytes[j] < '0' || bytes[j] > '9') {
                  break;
                }
                found_digit = true;
                slider_val = (slider_val * 10) + (bytes[j] - '0');
              }

              if (!found_digit) {
                ESP_LOGW("NEXTION_SLIDER", "Direct slider packet 0x91 received without digits");
                break;
              }
              if (slider_val < 15 || slider_val > 25) {
                ESP_LOGW("NEXTION_SLIDER", "Ignoring out-of-range direct Slider0 value: %d", slider_val);
                break;
              }

              id(nextion_slider_value) = slider_val;
              float desired_temp = (float) slider_val;
              ESP_LOGI("NEXTION_SLIDER", "Direct Slider0 value=%d -> target %.1f°C", slider_val, desired_temp);

              auto call = id(gazebo_thermostat).make_call();
              call.set_target_temperature(desired_temp);
              call.perform();
              break;
            }

# ============================================================================
# NEXTION DISPLAY COMPONENT
# ============================================================================

display:
  - platform: nextion
    uart_id: uart_nextion
    id: gazebo_nextion
    touch_sleep_timeout: 0
    wake_up_page: 0
    on_touch:
      then:
        - lambda: |-
            ESP_LOGI("NEXTION_TOUCH", "Touch: page=%d, component=%d, pressed=%d", page_id, component_id, touch_event);
            // When slider (component_id=4) is released on Page 3, capture touch
            if (page_id == 3 && component_id == 4 && touch_event == false) {
              id(slider_touched) = true;
              ESP_LOGI("NEXTION_SLIDER", "Slider touch released on Page 3");
            }
    on_sleep:
      then:
        - lambda: |-
            id(nextion_sleeping) = true;
            ESP_LOGI("NEXTION_SLEEP", "Display entered sleep mode");
    on_wake:
      then:
        - lambda: |-
            id(nextion_sleeping) = false;
            ESP_LOGI("NEXTION_WAKE", "Display woke from sleep - waiting for ready...");
        - delay: 500ms  # Give Nextion time to fully wake before sending commands
        - script.execute: refresh_nextion_all
    on_setup:
      then:
        - logger.log: "Nextion display connected"
        - lambda: |-
            // Display just connected - assume it's awake
            id(nextion_sleeping) = false;
    lambda: |-
      // Placeholder lambda - display updates via send_command_printf
      ESP_LOGD("NEXTION", "Display lambda executed");


# ============================================================================
# NEXTION SLIDER INPUT - Process slider touch events
# ============================================================================
# When slider is touched, try to read the value from UART buffer
# The Nextion sends "prints Slider0.val,0" on touch release

interval:
  - interval: 300ms
    then:
      - if:
          condition:
            lambda: 'return id(slider_touched);'
          then:
            - lambda: 'id(slider_touched) = false;'
            - delay: 100ms
            - script.execute: read_nextion_slider
